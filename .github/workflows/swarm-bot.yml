name: Swarm Bot Plan Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent mode
        type: choice
        options: [plan, dry-run, apply, delegate-copilot]
        default: plan
        required: true
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The dispatch input reaches the shell only through an env var (never
      # expression interpolation into the script) and is checked against an allow-list.
      - run: |
          case "$SWARM_MODE" in
            plan|dry-run|apply|delegate-copilot) ;;
            *) echo "::error::Unknown mode: $SWARM_MODE"; exit 1 ;;
          esac
          node dist/cli.js run-loop --repo . --mode "$SWARM_MODE" --mcp config/mcp.servers.example.json
        env:
          SWARM_MODE: ${{ inputs.mode || 'plan' }}
          SWARM_ALLOW_MCP: "false"
