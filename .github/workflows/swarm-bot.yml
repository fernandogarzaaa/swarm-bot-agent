name: Swarm Bot Plan Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Agent mode
        default: plan
        required: true
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js run-loop --repo . --mode "${{ inputs.mode || 'plan' }}" --mcp config/mcp.servers.example.json
        env:
          SWARM_ALLOW_MCP: "false"
